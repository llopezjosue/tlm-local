<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reliable-chat: local assistant with a trust score</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>reliable-chat</h1>
    <p>A local assistant, with a trust score on every answer.</p>
  </header>

  <main class="chat-shell">
    <div class="mode-row">
      <label for="quality-preset">Scoring depth</label>
      <select id="quality-preset">
        <option value="medium" selected>Fast: self-reflection only</option>
        <option value="high">Thorough: + consistency (2-3x slower, stricter score)</option>
      </select>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="chat-form" class="composer">
      <input
        id="question-input"
        type="text"
        placeholder="Ask your question..."
        autocomplete="off"
        required
      />
      <button type="submit" id="send-button">Send</button>
    </form>

    <p class="latency-note">
      Everything runs locally (Ollama). A scored answer takes from about a minute to
      several, depending on the machine.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
